[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "rag-ingestion"
version = "0.1.0"
description = "Production-grade Retrieval Augmented Generation (RAG) ingestion pipeline."
readme = "README.md"
requires-python = ">= 3.12.13"
license = { text = "MIT" }
authors = [
    { name = "Your Name" }
]
keywords = [
    "rag",
    "retrieval",
    "ingestion",
    "docling",
    "chromadb",
    "sentence-transformers"
]

dependencies = [
    "docling>=2.40.0,<3.0.0",
    "chromadb>=1.0",
    "sentence-transformers>=3.0.1,<4.0.0",
    "torch>=2.3.1,<3.0.0",
    "pydantic>=2.8.2,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "structlog>=24.2.0,<25.0.0",
    "pytest>=8.4.2",
    "reportlab>=5.0.0",
    "transformers>=4.51.3",
    "hf-xet>=1.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.5.5,<0.6.0",
    "mypy>=1.11.1,<2.0.0",
]

[project.scripts]
rag-ingestion = "rag_ingestion.interface.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ingestion"]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: marks integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
